# Machine-checkable expectations for tools/validate-vault.py behavior.
#
# Each fixture vault is built by build_fixtures.py (wipes + rebuilds under
# vaults/). Every fixture shares the same boot file at _boot/CLAUDE.md (outside
# the vault dirs) except 10-legacy, which is run WITHOUT --boot.
#
# Fields compared by tests/run_vault_validator.py:
#   state            vault_state in the report (current|partial|legacy|incompatible)
#   verdict          PASS | FAIL | BLOCKED
#   errors           exact set of finding IDs expected in "errors"
#   warnings         exact set of finding IDs expected in "warnings"
#   flagged          exact set of finding IDs expected in "flagged"
#   info_required    subset of finding IDs that MUST appear in "information"
#   structural_excluded  exact files_excluded count, when set
#   run_boot         false only for fixtures run without --boot
boot: _boot/CLAUDE.md
fixtures:
